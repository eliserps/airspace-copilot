[project]
name = "airspace-copilot"
version = "2.0.0"
description = "Live air traffic and aviation weather, explained by an LLM copilot."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "groq>=1.5",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "truststore>=0.10",
    "uvicorn[standard]>=0.51",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/copilot/guardrails.py" = ["E501", "RUF001"]
"tests/**" = ["RUF001"]
"evals/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["truststore.*"]
ignore_missing_imports = true
