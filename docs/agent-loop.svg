<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" width="980" height="270" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a5"/>
    </marker>
  </defs>

  <g text-anchor="middle" fill="#ffffff">
    <rect x="10" y="30" width="180" height="90" rx="14" fill="#475569"/>
    <text x="100" y="68" font-size="18" font-weight="700">Question</text>
    <text x="100" y="94" font-size="13" font-style="italic" opacity="0.9">from the chat</text>

    <rect x="260" y="30" width="200" height="90" rx="14" fill="#0f9d8a"/>
    <text x="360" y="64" font-size="18" font-weight="700">Guardrails</text>
    <text x="360" y="88" font-size="13" font-family="Consolas, Menlo, monospace">guardrails.py</text>
    <text x="360" y="108" font-size="13" font-style="italic" opacity="0.9">reject invalid · flag injection</text>

    <rect x="530" y="30" width="200" height="90" rx="14" fill="#7c5cff"/>
    <text x="630" y="64" font-size="18" font-weight="700">AI model decides</text>
    <text x="630" y="88" font-size="13" font-family="Consolas, Menlo, monospace">agent.py</text>
    <text x="630" y="108" font-size="13" font-style="italic" opacity="0.9">answer now, or ask for data?</text>

    <rect x="800" y="30" width="170" height="90" rx="14" fill="#475569"/>
    <text x="885" y="68" font-size="18" font-weight="700">Answer</text>
    <text x="885" y="94" font-size="13" font-style="italic" opacity="0.9">in the user's language</text>

    <rect x="530" y="170" width="200" height="86" rx="14" fill="#e8762b"/>
    <text x="630" y="202" font-size="18" font-weight="700">Code runs a tool</text>
    <text x="630" y="226" font-size="13" font-family="Consolas, Menlo, monospace">get_metar</text>
    <text x="630" y="244" font-size="13" font-family="Consolas, Menlo, monospace">count_aircraft</text>
  </g>

  <g stroke="#8b95a5" stroke-width="2.5" marker-end="url(#arrow)" fill="none">
    <line x1="194" y1="75" x2="254" y2="75"/>
    <line x1="464" y1="75" x2="524" y2="75"/>
    <line x1="734" y1="75" x2="794" y2="75"/>
    <line x1="600" y1="124" x2="600" y2="164"/>
    <line x1="660" y1="166" x2="660" y2="126"/>
  </g>

  <g fill="#8b95a5" font-size="13" font-weight="600">
    <text x="592" y="150" text-anchor="end">needs data</text>
    <text x="668" y="150">result</text>
    <text x="764" y="66" text-anchor="middle">done</text>
    <text x="745" y="205">repeats up to 5 times,</text>
    <text x="745" y="224">then must answer</text>
  </g>
</svg>
